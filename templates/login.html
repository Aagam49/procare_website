<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login – ProCare Physiotherapy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#0f766e',
            'primary-dark': '#115e59',
            accent: '#f59e0b',
            warm: '#f8fafc'
          },
          fontFamily: {
            sans: ['Manrope', 'system-ui', 'sans-serif']
          }
        }
      }
    }
  </script>
</head>
<body class="font-sans bg-gradient-to-br from-teal-50 via-white to-teal-50 flex items-center justify-center min-h-screen px-4">

  <div class="w-full max-w-md">
    <!-- Logo & Branding -->
    <div class="text-center mb-8">
      <a href="/" class="inline-block">
        <img src="/static/images/procare-logo.jpg" alt="ProCare Physiotherapy" class="w-16 h-16 rounded-2xl mx-auto mb-4 shadow-md" />
      </a>
      <h1 class="text-2xl font-extrabold text-slate-800">Staff Login</h1>
      <p class="text-sm text-slate-500 mt-1">ProCare Clinic Management</p>
    </div>

    <!-- Login Card -->
    <div class="bg-white rounded-2xl shadow-lg border border-slate-200 p-8">

      {% if error %}
      <div class="mb-6 px-4 py-3 rounded-xl bg-red-50 border border-red-200 text-red-700 text-sm font-medium text-center">
        {{ error }}
      </div>
      {% endif %}

      <form method="post" action="/login" class="space-y-5">
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1.5" for="username">Username</label>
          <input
            class="w-full border border-slate-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary transition"
            type="text" id="username" name="username" autocomplete="username" placeholder="Enter your username" required />
        </div>
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1.5" for="password">Password</label>
          <input
            class="w-full border border-slate-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary transition"
            type="password" id="password" name="password" autocomplete="current-password" placeholder="Enter your password" required />
        </div>
        <button
          class="w-full bg-primary hover:bg-primary-dark text-white font-bold py-3 rounded-xl transition-all duration-200 shadow-sm hover:shadow-md"
          type="submit">
          Sign In
        </button>
      </form>
    </div>

    <!-- Back to site link -->
    <div class="text-center mt-6">
      <a href="/" class="text-sm text-slate-500 hover:text-primary transition font-medium">
        ← Back to website
      </a>
    </div>
  </div>

</body>
</html>
